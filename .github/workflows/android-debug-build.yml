name: Build Novellum APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Build debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # The repository's checked-in Gradle wrapper JAR currently fails
      # official wrapper validation, so use an official Gradle download
      # directly instead of executing that JAR.
      - name: Set up official Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.3.1"
          validate-wrappers: false

      - name: Verify build tools
        shell: bash
        run: |
          set -euxo pipefail
          java -version
          gradle --version
          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          test -d "${ANDROID_HOME}/platforms/android-36.1"
          test -d "${ANDROID_HOME}/build-tools/36.1.0"
          echo "Android build tools are ready."

      - name: Restore NOVELLUM signing key
        shell: bash
        env:
          NOVELLUM_DEBUG_KEYSTORE_B64: ${{ secrets.NOVELLUM_DEBUG_KEYSTORE_B64 }}
        run: |
          set -euo pipefail

          if [ -z "${NOVELLUM_DEBUG_KEYSTORE_B64:-}" ]; then
            echo "NOVELLUM_DEBUG_KEYSTORE_B64 is missing from GitHub Actions secrets."
            exit 1
          fi

          printf '%s' "$NOVELLUM_DEBUG_KEYSTORE_B64" | base64 --decode > "$GITHUB_WORKSPACE/debug.keystore"
          chmod 600 "$GITHUB_WORKSPACE/debug.keystore"

          keytool -list \
            -keystore "$GITHUB_WORKSPACE/debug.keystore" \
            -storepass android \
            -alias androiddebugkey

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle :app:assembleDebug \
            --stacktrace \
            --console=plain \
            2>&1 | tee gradle-build.log

      - name: Show APK output
        if: success()
        shell: bash
        run: |
          set -euxo pipefail
          find app/build/outputs/apk -type f -name "*.apk" -print -ls

      - name: Upload NOVELLUM APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: novellum-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: novellum-build-diagnostics
          path: |
            gradle-build.log
            **/build/reports/**
          if-no-files-found: ignore
          retention-days: 14
